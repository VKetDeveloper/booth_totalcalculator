name: Release Extension (from manifest version)

on:
  workflow_dispatch:
  push:
    branches: ["Master"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from manifest.json
        id: ver
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "manifest.json" ]; then
            echo "❌ manifest.json not found in repo root"
            exit 1
          fi

          VERSION=$(node -p "require('./manifest.json').version")
          if [ -z "$VERSION" ]; then
            echo "❌ version not found in manifest.json"
            exit 1
          fi

          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "manifest version: $VERSION"
          echo "release tag: $TAG"

      # ZIP直下に manifest.json が来るように、リポジトリ直下の中身をそのままZIP
      # .git / .github 等は除外
      - name: Pack ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_NAME="extension-${{ steps.ver.outputs.version }}.zip"

          zip -r "$ZIP_NAME" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "*.DS_Store" \
            -x "node_modules/*"

          echo "Packed: $ZIP_NAME"
          ls -lh "$ZIP_NAME"

      # タグがなければ作る。既にあればそのまま進む。
      - name: Create tag if missing
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = "${{ steps.ver.outputs.tag }}";

            let exists = true;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            } catch (e) {
              exists = false;
            }

            if (!exists) {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
              core.info(`Created tag ${tag} at ${context.sha}`);
            } else {
              core.info(`Tag ${tag} already exists`);
            }

      # Release がなければ作成、あれば既存を使う（generate_release_notes あり）
      - name: Create release if missing
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = "${{ steps.ver.outputs.tag }}";

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info(`Release already exists for ${tag}`);
            } catch (e) {
              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: tag,
                draft: false,
                prerelease: false,
                generate_release_notes: true,
              });
              core.info(`Created release for ${tag}`);
            }

      # ZIPをReleaseに添付（同名assetが既にあると失敗することがあるので version を入れている）
      - name: Upload asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            extension-${{ steps.ver.outputs.version }}.zip
